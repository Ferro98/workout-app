server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker and the HTML must never be cached, or updates won't reach users
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The image's mime.types doesn't know .webmanifest; browsers expect this type for installable PWAs
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hashed assets can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any unknown path serves index.html (React Router handles it)
    location / {
        try_files $uri /index.html;
    }
}